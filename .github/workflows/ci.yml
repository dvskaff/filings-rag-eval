name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (llama-cpp-python compiles once, then pip's cache reuses the wheel)
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check src serving scripts tests
          ruff format --check src serving scripts tests

      - name: Tests (grader, PDF parsing, BM25 and hybrid search, evaluation, cache, quality gate, API)
        run: pytest -q
